services:
  gateway_service:
    build: ./gateway_service
    ports:
      - "8000:8000"
    environment:
      - ORCH_URL=http://orchestrator_service:8001/run
      - TASK_URL=http://task_service:8002/task
      - ORCH_TIMEOUT=900
      - TASK_TIMEOUT=20
    depends_on:
      - orchestrator_service
      - task_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator_service:
    build: ./orchestrator_service
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_TIMEOUT=180
      - OLLAMA_NUM_PREDICT=900
      - OLLAMA_COST_PER_1K_TOKENS=${OLLAMA_COST_PER_1K_TOKENS:-0}
      - TASK_BASE_URL=http://task_service:8002
      - TASK_REQUEST_TIMEOUT=20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  task_service:
    build: ./task_service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=ai_collab_team
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
